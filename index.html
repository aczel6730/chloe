<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFF8F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221A20" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%229%22%20rx%3D%2211%22%20ry%3D%224%22%20fill%3D%22none%22%20stroke%3D%22%23F8C96B%22%20stroke-width%3D%223%22%2F%3E%3Cpath%20d%3D%22M12%2029%208%2012l15%208a24%2024%200%200%201%2018%200l15-8-4%2017a25%2025%200%201%201-40%200z%22%20fill%3D%22%23FFA9BD%22%20stroke%3D%22%235A4337%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2236%22%20r%3D%223.2%22%20fill%3D%22%235A4337%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2236%22%20r%3D%223.2%22%20fill%3D%22%235A4337%22%2F%3E%3Cellipse%20cx%3D%2232%22%20cy%3D%2244%22%20rx%3D%224.6%22%20ry%3D%223.4%22%20fill%3D%22%23E0678F%22%2F%3E%3Cellipse%20cx%3D%2215%22%20cy%3D%2242%22%20rx%3D%224%22%20ry%3D%222.6%22%20fill%3D%22%23FFC6D3%22%2F%3E%3Cellipse%20cx%3D%2249%22%20cy%3D%2242%22%20rx%3D%224%22%20ry%3D%222.6%22%20fill%3D%22%23FFC6D3%22%2F%3E%3C%2Fsvg%3E">
<title>Chloe 的小账本</title>
<style>
*,*::before,*::after{box-sizing:border-box}
/* 【重要】下面这条不能删：.fld 用了 display:inline-flex，
   会盖掉浏览器默认的 [hidden]{display:none}，导致 hidden 属性失效 */
[hidden]{display:none!important}

/* ============ 奶油小猫 · 浅色 ============ */
:root{
  color-scheme:light;
  --paper:#FFF8F3;
  --dot:rgba(255,164,183,.16);
  --cloud:#FFFFFF;
  --card:#FFFFFF;
  --panel:#FFF4F1;
  --panel-2:#FFF9F6;
  --ink:#5A4337;
  --ink2:#9A8172;
  --ink3:#C6AE9F;
  --line:#FBE3DC;
  --line-strong:#F6D2C8;
  --pink:#FFA9BD;
  --pink-ink:#D95C82;
  --pink-deep:#C94A73;
  --pink-shadow:#EE8CA6;
  --pink-soft:#FFF0F4;
  --pink-line:#FFD5E0;
  --honey:#F8C96B;
  --honey-ink:#B07818;
  --honey-deep:#9A6510;
  --honey-soft:#FFF8E5;
  --honey-line:#FFE7B0;
  --sky:#9FD3EC;
  --sky-ink:#3D7E9C;
  --sky-soft:#EEF9FF;
  --sky-line:#CDEBF9;
  --outline:#5A4337;
  --danger:#C94541;
  --danger-ink:#BC3D39;
  --danger-soft:#FFF0EE;
  --on-accent:#4A2B31;
  --shadow:0 20px 38px -26px rgba(214,120,120,.55);
  --shadow-sm:0 10px 20px -14px rgba(214,120,120,.5);
  --ring:0 0 0 4px rgba(255,169,189,.25);
  --tape:rgba(255,169,189,.7);
  --r:28px;
  --r-sm:18px;
}

/* ============ 奶油小猫 · 深色（夜间模式） ============ */
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --paper:#221A20;
    --dot:rgba(255,169,189,.07);
    --cloud:#3A2C34;
    --card:#2F242B;
    --panel:#3A2C34;
    --panel-2:#34282F;
    --ink:#F9EEE9;
    --ink2:#C3A9A0;
    --ink3:#917A76;
    --line:#4C3842;
    --line-strong:#5B4450;
    --pink:#FFA9BD;
    --pink-ink:#FFC0CE;
    --pink-deep:#FFB3C7;
    --pink-shadow:#8C4A5E;
    --pink-soft:#3B2832;
    --pink-line:#5A3C4A;
    --honey:#F8C96B;
    --honey-ink:#FFD98E;
    --honey-deep:#FFD98E;
    --honey-soft:#3A2F1D;
    --honey-line:#56441F;
    --sky:#9FD3EC;
    --sky-ink:#9ED9F5;
    --sky-soft:#1F333D;
    --sky-line:#2F4B58;
    --outline:#6B4F5C;
    --danger:#E4695F;
    --danger-ink:#FF9C93;
    --danger-soft:#3A2321;
    --on-accent:#3A1E28;
    --shadow:0 18px 34px -24px rgba(0,0,0,.9);
    --shadow-sm:0 10px 20px -14px rgba(0,0,0,.8);
    --ring:0 0 0 4px rgba(255,169,189,.2);
    --tape:rgba(255,169,189,.42);
  }
}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:14px;
  line-height:1.5;
  color:var(--ink);
  background-color:var(--paper);
  /* 奶油波点纸 */
  background-image:
    radial-gradient(var(--dot) 1.6px,transparent 1.7px),
    radial-gradient(var(--dot) 1.6px,transparent 1.7px);
  background-size:28px 28px,28px 28px;
  background-position:0 0,14px 14px;
  padding:clamp(20px,3.4vw,44px) 16px calc(24px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
::selection{background:rgba(255,169,189,.38)}
/* 顶部柔光：奶油粉 + 云朵蓝 + 蜂蜜金 */
body::before{
  content:"";
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60vw 42vw at 10% -4%,rgba(255,198,174,.45),transparent 68%),
    radial-gradient(52vw 38vw at 94% 0%,rgba(191,231,251,.4),transparent 70%),
    radial-gradient(50vw 34vw at 58% 102%,rgba(255,224,160,.22),transparent 72%);
}

button{font:inherit;touch-action:manipulation}
input,button{font-family:inherit}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
input:focus-visible{outline:none}

.wrap{max-width:960px;margin:0 auto;position:relative}

/* ---------- 漂浮云朵 ---------- */
.sky{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.cloud{
  position:absolute;width:122px;height:36px;border-radius:999px;
  background:var(--cloud);opacity:.55;
  box-shadow:0 12px 26px -20px rgba(170,130,110,.55);
}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:54px;height:54px;left:15px;top:-25px}
.cloud::after{width:36px;height:36px;right:17px;top:-15px}
.cloud.c1{left:3%;top:15%;animation:drift 17s ease-in-out infinite alternate}
.cloud.c2{right:5%;top:7%;width:88px;height:27px;opacity:.4;animation:drift 23s ease-in-out infinite alternate-reverse}
.cloud.c3{right:15%;bottom:7%;width:72px;height:23px;opacity:.28;animation:drift 28s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(26px,10px,0)}}

/* ---------- 星星装饰 ---------- */
.sparkle{position:absolute;pointer-events:none;animation:twinkle 4s ease-in-out infinite}
.sp1{width:24px;top:-4px;right:8%;color:var(--honey)}
.sp2{width:15px;top:70px;right:2%;color:var(--pink);animation-delay:1s}
.sp3{width:17px;top:10px;right:28%;color:var(--sky);animation-delay:1.9s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85) rotate(0)}50%{opacity:1;transform:scale(1.12) rotate(14deg)}}

/* ---------- 顶部名牌 ---------- */
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 15px}
.brand-tag{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 15px 7px 12px;
  font-family:"Yuanti SC",YouYuan,"Hiragino Maru Gothic ProN","Microsoft YaHei UI",system-ui,sans-serif;
  font-size:14px;font-weight:800;
  letter-spacing:1.8px;
  color:#8A5A12;
  background:linear-gradient(180deg,#FFE7AE,var(--honey));
  border:2.5px solid var(--outline);
  border-radius:999px;
  box-shadow:0 4px 0 rgba(138,90,18,.2);
  transform:rotate(-2deg);
}
.brand-tag svg{width:17px;height:17px;flex:0 0 auto;color:#C98A16}
.brand-side{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;
  font-size:11.5px;font-weight:700;letter-spacing:.6px;color:var(--ink2);
  background:var(--card);
  border:2px dashed var(--line-strong);
  border-radius:999px;
  transform:rotate(1.5deg);
}
.brand-side svg{width:14px;height:14px;flex:0 0 auto;color:var(--sky-ink)}

/* ---------- 页头 ---------- */
header{display:flex;align-items:center;gap:19px;margin-bottom:18px}
.mascot-wrap{position:relative;flex:0 0 auto;width:96px;height:96px}
.mascot-wrap::before{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  border:2px dashed rgba(248,201,107,.75);
  animation:spin 34s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.mascot{
  position:relative;display:block;
  width:100%;height:100%;
  object-fit:cover;border-radius:50%;
  border:3px solid var(--card);
  box-shadow:0 0 0 3px var(--honey),0 16px 26px -14px rgba(190,130,60,.7);
  animation:bob 5.5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(-2deg)}}
.paw-badge{
  position:absolute;right:-3px;bottom:1px;z-index:1;
  width:29px;height:29px;display:grid;place-items:center;
  color:var(--on-accent);
  background:linear-gradient(180deg,#FFC3D2,var(--pink));
  border:2.5px solid var(--card);border-radius:50%;
  box-shadow:0 3px 0 var(--pink-shadow);
  transform:rotate(8deg);
}
.paw-badge svg{width:15px;height:15px}

.head-text{min-width:0}
h1{
  margin:0 0 4px;
  font-family:"Yuanti SC",YouYuan,"Hiragino Maru Gothic ProN","Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
  font-size:clamp(22px,3.8vw,30px);
  line-height:1.25;
  letter-spacing:.6px;
}
.name-en{
  font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
  font-size:1.14em;font-weight:700;letter-spacing:.5px;
  color:var(--pink-deep);margin-right:1px;
}
h1 .hl{position:relative;display:inline-block}
h1 .hl::after{
  content:"";position:absolute;left:-6px;right:-6px;bottom:2px;height:11px;z-index:-1;
  border-radius:7px;transform:rotate(-1.4deg);
  background:linear-gradient(90deg,var(--honey) 0%,#FFDD9F 55%,var(--honey) 100%);
  opacity:.82;
}
.sub{
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
  margin:0;font-size:12.5px;font-weight:600;letter-spacing:.4px;color:var(--ink2);
}
.sub svg{width:12px;height:12px;flex:0 0 auto;color:var(--pink)}

/* ---------- 小贴士 ---------- */
.hint{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 16px;margin:0 0 18px;
  font-size:12.5px;line-height:1.7;color:var(--honey-ink);
  background:var(--honey-soft);
  border:2px dashed var(--honey-line);
  border-radius:20px;
  box-shadow:var(--shadow-sm);
  transform:rotate(-.25deg);
}
.hint-ic{
  flex:0 0 auto;width:26px;height:26px;margin-top:1px;
  display:grid;place-items:center;
  color:#7A4E0B;background:var(--honey);
  border-radius:50%;
  box-shadow:0 2px 0 var(--honey-line);
}
.hint-ic svg{width:14px;height:14px}
.hint b{font-weight:800}
.hint kbd{
  padding:1px 6px;font-family:inherit;font-size:11px;font-weight:800;
  color:var(--honey-ink);background:var(--card);
  border:1.5px solid var(--honey-line);border-radius:6px;
  box-shadow:0 1.5px 0 var(--honey-line);
}

/* ---------- 卡片列表 ---------- */
.list{display:flex;flex-direction:column;gap:16px}

.row{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 196px;
  gap:14px 18px;
  padding:16px 18px;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow);
  transition:box-shadow .2s,transform .2s,opacity .2s,border-color .2s;
}
@media (hover:hover){
  .row:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:0 26px 42px -28px rgba(214,120,120,.68)}
}
.row:focus-within{border-color:var(--pink);box-shadow:var(--shadow),var(--ring)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:12px}

.row-top{display:flex;align-items:center;gap:8px}
.badge{
  width:34px;height:34px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:50%;
  font-size:12.5px;font-weight:800;letter-spacing:.3px;
  font-variant-numeric:tabular-nums;
  color:var(--pink-ink);background:var(--pink-soft);
  border:2px solid var(--pink-line);
}
.row:nth-child(3n+2) .badge{color:var(--honey-ink);background:var(--honey-soft);border-color:var(--honey-line)}
.row:nth-child(3n) .badge{color:var(--sky-ink);background:var(--sky-soft);border-color:var(--sky-line)}

/* ---------- 输入控件 ---------- */
.inp{
  width:100%;min-width:0;
  padding:8px 11px;
  font-size:14px;color:var(--ink);
  background:var(--panel);
  border:2px solid transparent;
  border-radius:14px;
  font-variant-numeric:tabular-nums;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.inp:hover{background:var(--panel-2);border-color:var(--line)}
.inp:focus{outline:none;background:var(--card);border-color:var(--pink);box-shadow:var(--ring)}
.inp::placeholder{color:var(--ink3)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.4;cursor:pointer}
input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:.85}

.name{
  flex:1 1 auto;
  padding:5px 2px;
  font-size:15.5px;font-weight:700;
  background:transparent;border:0;border-bottom:2px dashed var(--line-strong);
  border-radius:0;
}
.name:hover{background:transparent;border-color:var(--pink)}
.name:focus{background:transparent;border-bottom:2px solid var(--pink);box-shadow:none}

.icon-btn{
  width:32px;height:32px;flex:0 0 auto;
  display:grid;place-items:center;
  color:var(--ink3);background:transparent;
  border:2px solid transparent;border-radius:50%;
  cursor:pointer;transition:.16s;
}
.dup:hover{color:var(--pink-ink);background:var(--pink-soft);border-color:var(--pink-line);transform:rotate(-8deg) scale(1.06)}
.del{margin-left:1px}
.del:hover{color:var(--danger-ink);background:var(--danger-soft);border-color:#F7CFCB;transform:rotate(90deg)}

.row-ctrl{display:flex;flex-wrap:wrap;align-items:center;gap:11px 14px}
.fld{display:inline-flex;align-items:center;gap:6px;min-width:0}
.lbl{flex:0 0 auto;font-size:12.5px;color:var(--ink2);font-weight:700}
.unit{flex:0 0 auto;font-size:12px;color:var(--ink3)}
.tilde{color:var(--pink);font-size:13px;font-weight:800}

.t-start,.t-end{width:112px}
.h-val,.deduct{width:68px;text-align:center;font-weight:700}
.rate{width:84px;font-weight:700}
.fld-note{flex:1 1 150px}
.notev{min-width:110px}

/* ---------- 计费方式切换 ---------- */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--panel);border-radius:999px}
.seg-btn{
  padding:5px 13px;
  font-size:12.5px;font-weight:700;color:var(--ink2);
  background:transparent;border:0;border-radius:999px;
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.seg-btn:hover{color:var(--pink-ink)}
.seg-btn.on{
  color:var(--on-accent);
  background:linear-gradient(180deg,#FFC3D2,var(--pink));
  box-shadow:0 2.5px 0 var(--pink-shadow);
}

/* ---------- 时长加减 ---------- */
.step{display:inline-flex;align-items:center;gap:5px}
.mini{
  width:28px;height:28px;flex:0 0 auto;
  display:grid;place-items:center;
  font-size:16px;font-weight:700;line-height:1;color:var(--pink-ink);
  background:var(--pink-soft);border:0;border-radius:50%;
  box-shadow:0 2.5px 0 var(--pink-line);
  cursor:pointer;transition:.12s;
}
.mini:hover{background:var(--pink);color:var(--on-accent)}
.mini:active{transform:translateY(2.5px);box-shadow:0 0 0 transparent}

/* ---------- 单行结果（云朵小气泡） ---------- */
.row-out{
  position:relative;
  grid-column:2;grid-row:1;align-self:stretch;
  display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:14px 16px 14px 22px;
  text-align:right;
  background:var(--pink-soft);
  border:2px dashed var(--pink-line);
  border-radius:22px;
  transition:background .2s,border-color .2s,box-shadow .2s;
}
/* 气泡的小尾巴，从金额指向左边 */
.row-out::after{
  content:"";position:absolute;left:-9px;bottom:20px;
  width:16px;height:16px;
  background:inherit;
  border-left:2px solid var(--pink-line);
  border-bottom:2px solid var(--pink-line);
  border-radius:0 0 0 5px;
  transform:rotate(45deg);
  transition:border-color .2s;
}
.row.has-val .row-out{
  background:var(--honey-soft);
  border-style:solid;border-color:var(--honey);
  box-shadow:0 12px 20px -18px rgba(180,120,20,.85);
}
.row.has-val .row-out::after{border-color:var(--honey)}
.out-spark{
  position:absolute;left:9px;top:12px;
  font-size:13px;line-height:1;color:var(--honey);
  opacity:.35;transition:opacity .2s;
}
.row.has-val .out-spark{opacity:1;animation:twinkle 4.5s ease-in-out infinite}
.out-dur{font-size:12px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.out-amt{
  font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.25;
  color:var(--ink3);font-variant-numeric:tabular-nums;
  transform-origin:right center;
  transition:color .2s;
}
.row.has-val .out-amt{color:var(--honey-deep)}
.out-amt .cur{margin-right:1px;font-size:14px;font-weight:800}
.out-amt.long{font-size:21px;letter-spacing:-.7px}
.out-amt.long .cur{font-size:12px}
.out-amt.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.out-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin-top:3px}
.tag{
  padding:2px 8px;border-radius:999px;white-space:nowrap;
  font-size:10.5px;font-weight:700;
  background:var(--honey-soft);color:var(--honey-ink);
  border:1.5px solid var(--honey-line);
}
.tag.cross{background:var(--sky-soft);color:var(--sky-ink);border-color:var(--sky-line)}
.tag.warn{background:var(--danger-soft);color:var(--danger-ink);border-color:#F7CFCB}
@media (prefers-color-scheme:dark){.tag.warn{border-color:#6A3A36}}

/* ---------- 添加按钮 ---------- */
.add{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;margin-top:16px;padding:16px;
  font-size:14px;font-weight:800;color:var(--pink-ink);
  background:transparent;
  border:2.5px dashed var(--pink);
  border-radius:var(--r);
  cursor:pointer;transition:.18s;
}
.add .plus{
  display:grid;place-items:center;
  width:26px;height:26px;flex:0 0 auto;
  color:var(--on-accent);background:var(--pink);
  border-radius:50%;
  box-shadow:0 2.5px 0 var(--pink-shadow);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.add:hover{background:var(--pink-soft);box-shadow:var(--shadow-sm)}
.add:hover .plus{transform:rotate(90deg) scale(1.12)}
.add:active{transform:scale(.99)}

/* ---------- 合计小票 ---------- */
.summary{
  position:relative;              /* 胶带靠它定位，不能删 */
  display:flex;align-items:center;flex-wrap:wrap;gap:14px 22px;
  margin-top:32px;padding:18px 22px 16px;
  background:var(--card);
  border:2px solid var(--line);
  border-radius:26px;
  box-shadow:var(--shadow);
}
/* 顶部波点和纸胶带 */
.summary::before{
  content:"";position:absolute;top:-11px;left:50%;
  width:118px;height:22px;margin-left:-59px;border-radius:4px;
  background:
    radial-gradient(rgba(255,255,255,.7) 2.2px,transparent 2.4px) 0 0/11px 11px,
    var(--tape);
  box-shadow:0 2px 4px rgba(88,64,70,.12);
  transform:rotate(-1.6deg);
}
.sumi{display:flex;flex-direction:column;gap:0;min-width:0}
.sumi .k{font-size:11px;color:var(--ink2);font-weight:800;letter-spacing:.6px}
.sumi .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.sumi.total{
  margin-left:auto;
  padding-left:18px;
  border-left:2px dashed var(--line);
}
.sumi.total .k::before{content:"✦ ";color:var(--honey)}
.sumi.total .v{font-size:28px;letter-spacing:-.5px;color:var(--pink-deep)}
.sumi.total .v .cur{font-size:16px;margin-right:1px}
.sum-actions{display:flex;gap:9px;margin-left:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 18px;white-space:nowrap;
  font-size:13.5px;font-weight:800;color:var(--ink);
  background:var(--card);
  border:2px solid var(--line);border-radius:16px;
  box-shadow:0 3px 0 var(--line-strong);
  cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s,color .15s,border-color .15s;
}
.btn svg{flex:0 0 auto}
.btn:hover{background:var(--pink-soft);border-color:var(--pink);color:var(--pink-ink);box-shadow:0 3px 0 var(--pink-line)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 transparent}
.btn.primary{
  color:var(--on-accent);
  background:linear-gradient(180deg,#FFC3D2,var(--pink));
  border-color:var(--pink);
  box-shadow:0 3px 0 var(--pink-shadow);
}
.btn.primary:hover{border-color:var(--pink);color:var(--on-accent);box-shadow:0 3px 0 var(--pink-shadow);filter:brightness(1.03)}
.btn.primary:active{box-shadow:0 0 0 transparent}
.btn.armed{color:#fff;background:var(--danger);border-color:var(--danger);box-shadow:0 3px 0 #8F2F2C}
.btn.armed:hover{color:#fff;background:var(--danger);border-color:var(--danger);box-shadow:0 3px 0 #8F2F2C}
.btn.armed:active{box-shadow:0 0 0 transparent}

/* ---------- 页脚 ---------- */
.foot{
  margin:22px 0 0;text-align:center;
  font-size:11.5px;font-weight:600;letter-spacing:1.1px;color:var(--ink3);
}
.foot .pw{color:var(--pink);letter-spacing:0}

/* ---------- 出错提示 ---------- */
.fatal{
  margin:14px 0 0;padding:13px 16px;
  font-size:13px;line-height:1.65;font-weight:600;
  color:var(--danger-ink);background:var(--danger-soft);
  border:2px solid var(--danger);border-radius:16px;
}

/* ---------- 轻提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:30;
  display:flex;align-items:center;justify-content:center;gap:8px;
  max-width:calc(100vw - 32px);
  padding:12px 20px;
  font-size:13.5px;font-weight:700;
  color:var(--on-accent);
  background:linear-gradient(180deg,#FFC6D4,var(--pink));
  border:2px solid rgba(255,255,255,.65);
  border-radius:999px;
  box-shadow:0 4px 0 var(--pink-shadow),0 16px 30px -16px rgba(232,100,143,.75);
  opacity:0;pointer-events:none;
  transform:translate(-50%,18px) scale(.96);
  transition:opacity .24s,transform .24s;
}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1)}
.toast .t-ic{width:16px;height:16px;flex:0 0 auto}
.toast .act{
  margin-left:2px;padding:4px 11px;
  font-size:12.5px;font-weight:800;color:var(--on-accent);
  background:rgba(255,255,255,.6);
  border:0;border-radius:999px;
  cursor:pointer;white-space:nowrap;
}
.toast .act:hover{background:#fff}

/* ============ 移动端 ============ */
@media (max-width:800px){
  body{font-size:14px}
  /* 16px 字号可防止 iOS 聚焦时自动放大页面 */
  .inp,.name{font-size:16px}
  .name{font-size:16.5px}
  .inp{padding:10px 12px}
  .t-start,.t-end{width:auto}
  .h-val,.deduct{width:72px}
  .rate{width:88px}

  .sp1{right:4%;top:0;width:20px}
  .sp2,.sp3{display:none}

  .topline{margin-bottom:12px}
  .brand-tag{font-size:13px;letter-spacing:1.5px;padding:5px 12px 6px 10px}
  .brand-side{display:none}
  header{gap:14px;margin-bottom:16px}
  .mascot-wrap{width:82px;height:82px}
  .mascot-wrap::before{inset:-5px}
  .paw-badge{width:25px;height:25px;border-width:2px}
  .paw-badge svg{width:13px;height:13px}
  h1{font-size:22px}
  .sub{font-size:12px}

  .row{grid-template-columns:minmax(0,1fr);padding:15px;gap:13px}
  .row-out{
    grid-column:1;grid-row:auto;
    flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;
    text-align:left;gap:3px 12px;
    padding:12px 16px 12px 26px;
  }
  .row-out::after{display:none}          /* 换行排版时小尾巴会指空，藏起来 */
  .row-out .out-spark{top:50%;left:9px;transform:translateY(-50%);font-size:12px}
  .out-tags{flex-basis:100%;justify-content:flex-start;margin-top:4px}
  .out-amt{font-size:25px;transform-origin:left center}

  /* 时段两格撑满整行，避免横向溢出 */
  .range-only{width:100%}
  .range-only .t-start,.range-only .t-end{flex:1 1 0;width:auto;min-width:0}
  .row-ctrl{gap:12px 14px}

  /* 更大的点按区域 */
  .seg-btn{padding:8px 15px;font-size:13px}
  .mini{width:36px;height:36px;font-size:18px}
  .icon-btn{width:38px;height:38px}
  .badge{width:36px;height:36px}
  .btn{padding:13px 18px}
  .add{padding:17px}

  .summary{gap:10px 16px;padding:16px 16px 14px;margin-top:30px}
  .summary::before{width:96px;height:20px;margin-left:-48px}
  .sumi.total{margin-left:auto;padding-left:0;border-left:0}
  .sum-actions{width:100%;margin-left:0}
  .sum-actions .btn{flex:1}
  .cloud.c3{display:none}
}
@media (max-width:420px){
  body{padding-left:12px;padding-right:12px}
  .mascot-wrap{width:72px;height:72px}
  h1{font-size:20px}
  .name-en{font-size:1.08em}
  .rate{width:80px}
  .sumi .v{font-size:15px}
  .sumi.total .v{font-size:24px}
  .hint{font-size:12px;padding:11px 13px}
  .hint-ic{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

<script>
(function(){
  'use strict';

  var KEY = 'chloe-ledger-v1';
  var listEl = document.getElementById('list');
  var tpl = document.getElementById('rowTpl');

  /* ---------- 小工具 ---------- */
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function num(v, dft){
    var n = parseFloat(String(v == null ? '' : v).trim());
    return isFinite(n) ? n : (dft || 0);
  }
  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
  function group(n){                        // 1234.5 -> "1,234.50"
    var p = Math.abs(n).toFixed(2).split('.');
    return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
  }
  function trimNum(n){ return String(Math.round(n * 100) / 100); }
  function toMin(t){                        // "18:30" -> 1110
    var m = /^(\d{1,2}):(\d{2})/.exec(t || '');
    if(!m) return null;
    var h = +m[1], mi = +m[2];
    return (h < 24 && mi < 60) ? h * 60 + mi : null;
  }
  function fmtMin(t){                       // 270 -> "4.50 小时（270 分钟）"
    t = Math.max(0, Math.round(t));         // 全程以整分钟为基准，两种形式由同一个值换算，不会对不上
    return round2(t / 60).toFixed(2) + ' 小时（' + t + ' 分钟）';
  }
  function fmtMinOnly(t){ return Math.max(0, Math.round(t)) + ' 分钟'; }

  /* ---------- 计算 ---------- */
  function calc(row){
    var mode = row.dataset.mode || 'range';
    var rate = Math.max(0, num($('.rate', row).value));

    var mins = 0, cross = false, warn = '';

    if(mode === 'range'){
      var a = toMin($('.t-start', row).value), b = toMin($('.t-end', row).value);
      if(a === null || b === null){
        warn = '待填时间';
      }else{
        var d = b - a;
        if(d < 0){ d += 1440; cross = true; }   // 跨天
        else if(d === 0){ warn = '时段为 0'; }
        mins = d;
      }
    }else{
      mins = Math.round(Math.max(0, num($('.h-val', row).value)) * 60);   // 小时 -> 整分钟
    }

    /* 赔付按分钟填，从这一位的时长里扣，扣到 0 为止，不会算成负数 */
    var deduct = Math.round(Math.max(0, num($('.deduct', row).value)));
    if(deduct > mins){
      deduct = mins;
      if(mins > 0) warn = warn || '赔付超额';
    }
    var netMin = mins - deduct;

    var amount = round2(netMin / 60 * rate);

    return { mode: mode, mins: mins, deduct: deduct, netMin: netMin, rate: rate, amount: amount, cross: cross, warn: warn };
  }

  /* 完全空白的一行不显示「待填时间」，页面刚打开时更清爽 */
  function isBlank(row){
    return !$('.name', row).value.trim() &&
           !$('.t-start', row).value && !$('.t-end', row).value &&
           !$('.h-val', row).value && !$('.deduct', row).value &&
           !$('.rate', row).value && !$('.notev', row).value;
  }

  function tagEl(text, cls){
    var s = document.createElement('span');
    s.className = 'tag' + (cls ? ' ' + cls : '');
    s.textContent = text;
    return s;
  }

  function paint(row, r){
    $('.out-dur', row).textContent = fmtMin(r.netMin);

    var box = $('.out-amt', row);
    var val = $('.val', box);
    var txt = group(r.amount);
    box.classList.toggle('long', txt.length >= 10);   // 金额太长时收一点字号，避免撑破小票
    if(val.textContent !== txt){
      var first = val.textContent === '0.00';
      val.textContent = txt;
      if(!first){                             // 数字变化时轻轻弹一下
        box.classList.remove('pop');
        void box.offsetWidth;
        box.classList.add('pop');
      }
    }

    var tags = $('.out-tags', row);
    tags.textContent = '';
    var blank = isBlank(row);
    if(r.warn && !blank) tags.appendChild(tagEl(r.warn, 'warn'));
    if(r.cross) tags.appendChild(tagEl('跨天', 'cross'));
    if(r.deduct > 0) tags.appendChild(tagEl('赔付 −' + fmtMinOnly(r.deduct)));

    row.classList.toggle('has-val', r.amount > 0);
  }

  /* ---------- 刷新全部 ---------- */
  function refresh(){
    var rows = $$('.row', listEl);
    var totalMin = 0, totalA = 0, totalD = 0, people = 0;

    rows.forEach(function(row, i){
      $('.badge', row).textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
      var r = calc(row);
      paint(row, r);

      var named = $('.name', row).value.trim();
      if(named || r.mins > 0) people++;   // 只填了单价、还没填时长的空行不算一位

      totalMin += r.netMin;
      totalD += r.deduct;
      totalA = round2(totalA + r.amount);
    });

    $('#sumCount').textContent = people + ' 位';
    $('#sumHours').textContent = fmtMin(totalMin);
    $('#sumDeduct').textContent = fmtMinOnly(totalD);
    $('#sumDeductWrap').hidden = !(totalD > 0);   // 没有赔付时不占地方
    $('#sumAmount').textContent = group(totalA);
    save();
  }

  /* ---------- 存取 ---------- */
  function readRow(row){
    return {
      mode: row.dataset.mode,
      name: $('.name', row).value,
      start: $('.t-start', row).value,
      end: $('.t-end', row).value,
      hours: $('.h-val', row).value,
      deduct: $('.deduct', row).value,
      rate: $('.rate', row).value,
      note: $('.notev', row).value
    };
  }
  function serialize(){
    return $$('.row', listEl).map(readRow);
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(serialize())); }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  /* ---------- 行 ---------- */
  function applyMode(row){
    var mode = row.dataset.mode === 'hours' ? 'hours' : 'range';
    row.dataset.mode = mode;
    $$('.seg-btn', row).forEach(function(b){
      var on = b.dataset.mode === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    $('.range-only', row).hidden = mode !== 'range';
    $('.hours-only', row).hidden = mode !== 'hours';
  }

  function addRow(data, afterRow){
    var row = tpl.content.firstElementChild.cloneNode(true);
    if(data){
      row.dataset.mode = data.mode === 'hours' ? 'hours' : 'range';
      $('.name', row).value = data.name || '';
      $('.t-start', row).value = data.start || '';
      $('.t-end', row).value = data.end || '';
      $('.h-val', row).value = data.hours || '';
      $('.deduct', row).value = data.deduct || '';
      $('.rate', row).value = data.rate || '';
      $('.notev', row).value = data.note || '';
    }
    applyMode(row);
    if(afterRow && afterRow.parentNode === listEl){
      listEl.insertBefore(row, afterRow.nextSibling);   // 复制出来的行紧跟在原行后面
    }else{
      listEl.appendChild(row);
    }
    return row;
  }

  function resetRow(row){
    ['name','h-val','deduct','rate','notev'].forEach(function(c){ $('.' + c, row).value = ''; });
    $('.t-start', row).value = '';
    $('.t-end', row).value = '';
    row.dataset.mode = 'range';
    applyMode(row);
  }

  /* ---------- 事件 ---------- */
  listEl.addEventListener('input', function(e){
    if(e.target.classList.contains('inp')) refresh();
  });

  /* 数字框聚焦时全选，直接输入就能覆盖旧值 */
  listEl.addEventListener('focusin', function(e){
    var t = e.target;
    if(t.classList && (t.classList.contains('rate') || t.classList.contains('deduct') || t.classList.contains('h-val'))){
      setTimeout(function(){ try{ t.select(); }catch(err){} }, 0);
    }
  });

  /* 昵称框里按 Enter = 添加下一位 */
  listEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('name')){
      e.preventDefault();
      addRowFromUI();
    }
  });

  listEl.addEventListener('click', function(e){
    var row = e.target.closest ? e.target.closest('.row') : null;
    if(!row) return;

    var seg = e.target.closest('.seg-btn');
    if(seg){ row.dataset.mode = seg.dataset.mode; applyMode(row); refresh(); return; }

    var mini = e.target.closest('.mini');
    if(mini){
      var inp = $('.h-val', row);
      var step = mini.classList.contains('plus') ? 0.5 : -0.5;
      var v = Math.max(0, round2(num(inp.value) + step));
      inp.value = v > 0 ? trimNum(v) : '';
      refresh();
      return;
    }

    if(e.target.closest('.dup')){
      var data = readRow(row);
      data.name = '';                         // 复制设置，但昵称留空，免得重名
      var copy = addRow(data, row);
      refresh();
      $('.name', copy).focus();
      if(copy.scrollIntoView && copy.getBoundingClientRect().bottom > window.innerHeight){
        copy.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      return;
    }

    if(e.target.closest('.del')){
      if($$('.row', listEl).length <= 1){
        resetRow(row);                        // 最后一行只清内容，保留结构
      }else{
        row.style.opacity = '0';
        row.style.transform = 'scale(.97)';
        setTimeout(function(){ row.remove(); refresh(); }, 150);
        return;
      }
      refresh();
    }
  });

  /* ---------- 添加 ---------- */
  function addRowFromUI(){
    var rows = $$('.row', listEl);
    var last = rows[rows.length - 1];
    var row = addRow();
    if(last && last !== row){                 // 沿用上一行的单价，少填几次
      $('.rate', row).value = $('.rate', last).value;
    }
    refresh();
    $('.name', row).focus();
    if(row.scrollIntoView) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  document.getElementById('addBtn').addEventListener('click', addRowFromUI);

  /* ---------- 复制账单 ---------- */
  function buildBill(){
    var rows = $$('.row', listEl);
    var lines = ['陪玩计费单', '· · · · · · · · · · · · · · · ·'];
    var totalMin = 0, totalA = 0, totalD = 0, n = 0;

    rows.forEach(function(row){
      var r = calc(row);
      var name = $('.name', row).value.trim();
      var note = $('.notev', row).value.trim();
      if(!name && !r.mins) return;

      n++;
      var detail = r.mode === 'hours'
        ? ''                                  // 时长模式下 fmtMin 已经把时长说全了，不再重复
        : ($('.t-start', row).value || '--:--') + '-' + ($('.t-end', row).value || '--:--') + (r.cross ? '(跨天)' : '');

      var line = n + '. ' + (name || '未命名') + '　' + (detail ? detail + '　' : '') + fmtMin(r.netMin);
      if(r.deduct > 0) line += '　赔付 −' + fmtMinOnly(r.deduct);
      if(r.rate > 0) line += '　单价 ¥' + trimNum(r.rate) + '/时';
      line += '　→ ¥' + group(r.amount);
      lines.push(line);
      if(note) lines.push('   备注：' + note);

      totalMin += r.netMin;
      totalD += r.deduct;
      totalA = round2(totalA + r.amount);
    });

    if(!n) return '';
    lines.push('· · · · · · · · · · · · · · · ·');
    lines.push('共 ' + n + ' 位　总时长 ' + fmtMin(totalMin));
    if(totalD > 0) lines.push('其中已赔付 ' + fmtMinOnly(totalD) + '，已从时长和金额中扣除');
    lines.push('合计金额 ¥' + group(totalA));
    lines.push('—— =^･ω･^= 谢谢陪伴 ♡ ——');
    return lines.join('\n');
  }

  function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }catch(e){ return false; }
  }

  document.getElementById('copyBtn').addEventListener('click', function(){
    var bill = buildBill();
    if(!bill){ toast('还没有可复制的记录'); return; }
    copyText(bill).then(function(ok){
      toast(ok ? '账单已复制 ♡ 去粘贴吧' : '复制失败，请手动选中复制');
    });
  });

  /* ---------- 清空（点两次确认，并支持撤销） ---------- */
  var clearBtn = document.getElementById('clearBtn');
  var armed = false, armTimer = null, undoSnapshot = null;
  function disarm(){
    armed = false;
    clearBtn.classList.remove('armed');
    clearBtn.lastChild.textContent = ' 清空';
  }
  clearBtn.addEventListener('click', function(){
    if(!armed){
      armed = true;
      clearBtn.classList.add('armed');
      clearBtn.lastChild.textContent = ' 再点一次清空';
      clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 3200);
      return;
    }
    clearTimeout(armTimer);
    disarm();

    undoSnapshot = serialize();               // 清空前留一份快照，5 秒内可撤销
    listEl.textContent = '';
    addRow();
    refresh();
    toast('已清空，重新开始', '撤销', function(){
      if(!undoSnapshot) return;
      var snap = undoSnapshot;
      undoSnapshot = null;
      listEl.textContent = '';
      snap.forEach(function(d){ addRow(d); });
      if(!$$('.row', listEl).length) addRow();
      refresh();
      toast('已经恢复啦 ♡');
    });
  });

  /* ---------- 轻提示 ---------- */
  var toastEl = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  var toastAct = document.getElementById('toastAct');
  var toastTimer = null;

  function toast(msg, actionLabel, actionFn){
    toastMsg.textContent = msg;
    if(actionLabel){
      toastAct.textContent = actionLabel;
      toastAct.hidden = false;
      toastAct.onclick = function(){
        clearTimeout(toastTimer);
        toastEl.classList.remove('show');
        toastAct.hidden = true;
        toastAct.onclick = null;
        if(actionFn) actionFn();
      };
    }else{
      toastAct.hidden = true;
      toastAct.onclick = null;
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.classList.remove('show');
      toastAct.hidden = true;
      toastAct.onclick = null;
    }, actionLabel ? 5200 : 2000);
  }

  /* ---------- 启动 ---------- */
  function showFatal(err){
    var p = document.createElement('p');
    p.className = 'fatal';
    p.textContent = '出错了：' + (err && err.message ? err.message : err) + ' —— 把这句话截图反馈即可定位问题。';
    var main = document.querySelector('main');
    (main || document.body).appendChild(p);
  }

  function boot(){
    var saved = load();
    if(saved && saved.length){
      saved.forEach(function(d){ addRow(d); });
    }else{
      addRow();
    }
    refresh();
  }

  try{
    boot();
  }catch(err){
    showFatal(err);
  }
  window.__ok = true;      // 告诉自检脚本：主脚本跑起来了
})();
</script>
</body>
</html>
